# k8s/rbac/worker-serviceaccount.yaml
#
# Dedicated ServiceAccount for all benchmark worker pods.
#
# Why a dedicated SA instead of the default SA?
#   The default ServiceAccount in most clusters has a mounted token that allows
#   unauthenticated read access to the K8s API. A contestant's code running
#   inside the sandbox could potentially read that token and query the API.
#   A dedicated SA with an empty Role (see worker-role.yaml) limits blast radius.
#
# automountServiceAccountToken: false
#   Workers do not need the auto-mounted token for any legitimate operation —
#   the only K8s API call they make (listing their own pod IP) is handled via
#   the Downward API, not the API server. Disabling the automount removes the
#   token from the pod filesystem entirely, eliminating the exfiltration surface.
#
# Workload Identity annotation:
#   The annotation links this K8s ServiceAccount to a GCP service account via
#   Workload Identity. Workers need no GCP permissions, so this annotation is
#   deliberately absent — the pod gets no GCP credentials at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexusbench-worker
  namespace: nexusbench
  labels:
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: nexusbench
automountServiceAccountToken: false
