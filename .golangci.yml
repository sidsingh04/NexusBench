# .golangci.yml
#
# golangci-lint v2 configuration for NexusBench.
# Docs: https://golangci-lint.run/usage/configuration/
# Migration guide (v1 → v2): https://golangci-lint.run/docs/product/migration-guide
#
# v2 breaking changes applied here:
#   - Added required top-level `version: "2"` key.
#   - `gosimple` and `unused` removed: both merged into `staticcheck` in v2.
#   - `linters-settings` renamed to `linters.settings` (nested under linters).
#   - `issues.exclude-rules` moved to `issues.exclude-rules` (unchanged path,
#     but `path` field now uses RE2 syntax — no change needed for our patterns).
#
# Run locally:  golangci-lint run ./...
# Run in CI:    golangci-lint run --timeout=5m ./...

version: "2"

run:
  timeout: 5m

linters:
  # Disable all linters by default, then enable only the ones listed below.
  # This avoids surprise breakage when golangci-lint adds new linters in a
  # minor release.
  default: none
  enable:
    # ── Bug catchers ─────────────────────────────────────────────────────────

    # errcheck: any unchecked error return is a potential silent failure.
    - errcheck

    # govet: reports constructs the Go compiler considers suspicious.
    - govet

    # staticcheck: covers staticcheck + gosimple + unused (all merged in v2).
    - staticcheck

    # ineffassign: detects assignments to variables that are never read.
    - ineffassign

    # ── Safety ───────────────────────────────────────────────────────────────

    # gosec: reports common security issues.
    - gosec

    # ── Correctness ──────────────────────────────────────────────────────────

    # bodyclose: HTTP response bodies must be closed.
    - bodyclose

    # nilerr: catches `if err != nil { return nil }`.
    - nilerr

    # ── Style ────────────────────────────────────────────────────────────────

    # gofmt: enforces standard Go formatting.
    - gofmt

    # misspell: catches common English spelling mistakes.
    - misspell

  settings:
    errcheck:
      exclude-functions:
        - fmt.Print
        - fmt.Println
        - fmt.Printf
        - (io.Closer).Close

    govet:
      enable:
        - shadow
        - printf

    staticcheck:
      checks:
        - "all"
        - "-SA1019"  # allow deprecated identifiers during migrations

    gosec:
      excludes:
        - G104  # covered by errcheck
        - G304  # intentional: user-provided archive paths
        - G307  # false positive: deferred close pattern

    gofmt:
      simplify: true

    misspell:
      locale: US

issues:
  max-same-issues: 50

  exclude-rules:
    - path: "_test.go"
      linters:
        - errcheck

    - path: "cmd/"
      linters:
        - gosec

    - path: "internal/metrics/metrics.go"
      linters:
        - gochecknoglobals
