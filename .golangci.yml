# .golangci.yml
#
# golangci-lint v2 configuration for NexusBench.
# Docs: https://golangci-lint.run/usage/configuration/
# Migration guide (v1 -> v2): https://golangci-lint.run/docs/product/migration-guide
#
# Key v2 changes applied here:
#   - Required top-level `version: "2"` key.
#   - `gosimple` and `unused` removed: merged into `staticcheck` in v2.
#   - `linters-settings` is now `linters.settings` (nested).
#   - `gofmt` reclassified as a formatter in v2: moved out of `linters.enable`
#     and into the top-level `formatters` block.

version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    # ── Bug catchers ─────────────────────────────────────────────────────────
    - errcheck
    - govet
    - staticcheck  # covers staticcheck + gosimple + unused (all merged in v2)
    - ineffassign

    # ── Safety ───────────────────────────────────────────────────────────────
    - gosec

    # ── Correctness ──────────────────────────────────────────────────────────
    - bodyclose
    - nilerr

    # ── Style ────────────────────────────────────────────────────────────────
    - misspell

  settings:
    errcheck:
      exclude-functions:
        - fmt.Print
        - fmt.Println
        - fmt.Printf
        - (io.Closer).Close

    govet:
      enable:
        - shadow
        - printf

    staticcheck:
      checks:
        - "all"
        - "-SA1019"  # allow deprecated identifiers during migrations

    gosec:
      excludes:
        - G104  # covered by errcheck
        - G304  # intentional: user-provided archive paths
        - G307  # false positive: deferred close pattern

    misspell:
      locale: US

# In golangci-lint v2, formatters are declared separately from linters.
# gofmt is a formatter and cannot appear in linters.enable.
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true

issues:
  max-same-issues: 50

  exclude-rules:
    - path: "_test.go"
      linters:
        - errcheck

    - path: "cmd/"
      linters:
        - gosec

    - path: "internal/metrics/metrics.go"
      linters:
        - gochecknoglobals
