version: "3.9"

# NexusBench — Local Development Stack
#
# Architecture: pre-built language images are spun on demand per submission.
# Build them first:  make images
# Then start:        docker compose up --build

services:

  # ── Control Plane ───────────────────────────────────────────────────────────
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDR: ":8080"
      SUBMISSION_DIR: "/data/submissions"

      # Per-language pre-built sandbox images.
      # These must exist on the Docker host before starting.
      # Build with: make images
      SANDBOX_IMAGE_GO:     "nexusbench-sandbox-go:latest"
      SANDBOX_IMAGE_RUST:   "nexusbench-sandbox-rust:latest"
      SANDBOX_IMAGE_CPP:    "nexusbench-sandbox-cpp:latest"
      SANDBOX_IMAGE_PYTHON: "nexusbench-sandbox-python:latest"
      SANDBOX_IMAGE_BINARY: "nexusbench-sandbox-binary:latest"

      # Resource limits per sandbox container
      SANDBOX_CPU_QUOTA:    "100000"       # 1 CPU core (µs/100ms)
      SANDBOX_MEMORY_BYTES: "536870912"    # 512 MiB
      SANDBOX_TIMEOUT:      "30m"
      SANDBOX_NETWORK_MODE: "bridge"
      SANDBOX_PORT_MIN:     "20000"
      SANDBOX_PORT_MAX:     "21000"
      MAX_UPLOAD_BYTES:     "268435456"    # 256 MiB

    volumes:
      - submissions_data:/data/submissions
      # Docker socket — lets control-plane spawn sibling containers.
      # In production, replace with a socket proxy (e.g. Tecnativa/docker-socket-proxy).
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ──────────────────────────────────────────────────────────────────────────
  # PHASE 2+ SERVICES (uncomment as you progress)
