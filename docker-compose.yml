version: "3.9"

# NexusBench — Local Development Stack
#
# Start everything:      docker compose up --build
# Start just Redpanda:   docker compose up redpanda -d
# Stop everything:       docker compose down -v

services:

  # ── Control Plane ───────────────────────────────────────────────────────────
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDR: ":8080"
      SUBMISSION_DIR: "/data/submissions"

      SANDBOX_IMAGE_GO:     "nexusbench-sandbox-go:latest"
      SANDBOX_IMAGE_RUST:   "nexusbench-sandbox-rust:latest"
      SANDBOX_IMAGE_CPP:    "nexusbench-sandbox-cpp:latest"
      SANDBOX_IMAGE_PYTHON: "nexusbench-sandbox-python:latest"
      SANDBOX_IMAGE_BINARY: "nexusbench-sandbox-binary:latest"

      SANDBOX_CPU_QUOTA:    "100000"
      SANDBOX_MEMORY_BYTES: "536870912"
      SANDBOX_TIMEOUT:      "30m"
      SANDBOX_NETWORK_MODE: "bridge"
      SANDBOX_PORT_MIN:     "20000"
      SANDBOX_PORT_MAX:     "21000"
      MAX_UPLOAD_BYTES:     "268435456"

      # Step 2: tell the control plane where Redpanda lives.
      # Inside the compose network the service name resolves as the hostname.
      REDPANDA_BROKERS: "redpanda:9092"

    volumes:
      - submissions_data:/data/submissions
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Redpanda (Kafka-compatible streaming backbone) ───────────────────────────
  #
  # Two listener addresses:
  #   internal://redpanda:9092   — used by services inside the compose network
  #   external://localhost:19092 — used by rpk and Go tests running on the host
  #
  # Why a fixed version tag?  Reproducibility. Never use :latest in dev stacks.
  redpanda:
    image: redpandadata/redpanda:v24.1.13
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=warn
    ports:
      - "19092:19092"   # Kafka API — host access for rpk and integration tests
      - "18082:18082"   # HTTP Proxy — optional REST access
      - "18081:18081"   # Schema Registry — optional, used in Phase 3+
      - "9644:9644"     # Admin API — used by rpk cluster info
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      # rpk cluster info exits 0 only when the broker is fully ready.
      test: ["CMD", "rpk", "cluster", "info", "--brokers", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

  # ── Redpanda Console (web UI for topic/message inspection) ──────────────────
  #
  # Open http://localhost:8088 to browse topics, view messages, and inspect
  # consumer group lag. Much faster than running rpk commands by hand.
  console:
    image: redpandadata/console:v2.6.0
    environment:
      CONFIG_FILEPATH: /etc/console/config.yaml
    volumes:
      - ./docker/console/config.yaml:/etc/console/config.yaml:ro
    ports:
      - "8088:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────
  # PHASE 2 STEP 3+ SERVICES (uncomment as you progress)
  # ──────────────────────────────────────────────────────────────────────────

  # ── TimescaleDB (time-series storage for latency windows) ─────────────────
  timescaledb:
    image: timescale/timescaledb:2.15.2-pg16
    environment:
      POSTGRES_DB: nexusbench
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nexus", "-d", "nexusbench"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Metrics Consumer (Redpanda → TimescaleDB) ───────────────────────────────
  metrics-consumer:
    build:
      context: .
      dockerfile: Dockerfile.server
    command: ["/app/consumer"]
    environment:
      REDPANDA_BROKERS: "redpanda:9092"
      CONSUMER_GROUP_ID: "nexusbench-consumer"
      TIMESCALE_DSN: "postgres://nexus:nexus_dev@timescaledb:5432/nexusbench"
    depends_on:
      redpanda:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle          # allows POST /-/reload to hot-reload config
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor
    restart: unless-stopped

  # ── cAdvisor — per-container resource metrics ─────────────────────────────
  # Reads Docker stats and exposes them as Prometheus metrics.
  # The nexusbench.submission_id label on each sandbox container is relabelled
  # into a submission_id Prometheus label by prometheus.yml.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "8081:8080"   # host:8081 avoids collision with control-plane:8080
    restart: unless-stopped

  # ── Node exporter — host machine metrics ──────────────────────────────────
  # network_mode:host is Linux-only and breaks on Windows Docker Desktop.
  # Instead we bind port 9100 and use host.docker.internal in prometheus.yml
  # to reach it. The /host volume gives node-exporter read access to the
  # real host filesystem (passed through the WSL2 layer on Windows).
  node-exporter:
    image: prom/node-exporter:v1.8.0
    command:
      - --path.rootfs=/host
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

volumes:
  submissions_data:
  redpanda_data:
  timescale_data:
  prometheus_data:
  # clickhouse_data:
  # grafana_data:
