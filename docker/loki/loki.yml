# Loki configuration for NexusBench local development.
# Mounted read-only into the Loki container at /etc/loki/loki.yml

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

# instance_addr must be 0.0.0.0 inside Docker — not 127.0.0.1.
# 127.0.0.1 causes the memberlist/ring to bind to loopback only, which
# produces the "empty ring" error when the ingester tries to register.
common:
  instance_addr: 0.0.0.0
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory:  /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  chunk_idle_period:   5m
  max_chunk_age:       1h
  chunk_target_size:   1048576
  chunk_retain_period: 30s
  # Disable WAL in single-process dev mode — simpler and no disk overhead.
  wal:
    enabled: false

limits_config:
  ingestion_rate_mb:       16
  ingestion_burst_size_mb: 32
  max_query_series:        5000
  max_query_lookback:      168h
  # Allow logs up to 24 hours old — fixes "entry too far behind" when
  # Promtail replays Docker logs that were written before Loki started.
  reject_old_samples:          true
  reject_old_samples_max_age:  24h
  # Allow logs up to 10 minutes in the future (clock skew tolerance).
  creation_grace_period:       10m

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled:     true
        max_size_mb: 100
