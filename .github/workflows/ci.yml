# .github/workflows/ci.yml
#
# CI gate — runs on every pull_request targeting main and on every push to main.
#
# Jobs (run in parallel):
#   lint         — golangci-lint with .golangci.yml
#   unit-tests   — go test -race -coverprofile, upload artifact
#   tf-validate  — terraform fmt -check + validate (-backend=false)
#   k8s-validate — kubeconform + stage 4.2/4.3 dry-run scripts
#
# No cloud credentials required — all checks run entirely offline.
# Cloud credentials only appear in deploy.yml (main branch only).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same branch/PR on new push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.x"

jobs:
  # ── Job 1: lint ────────────────────────────────────────────────────────────
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Opt into Node.js 24 now to avoid the forced migration failure
      # after September 2026 when Node.js 20 is removed from runners.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Do NOT pin a specific version here.
          # v1.59.1 ships an internal Go toolchain that cannot parse export
          # data produced by Go 1.25+ ("unsupported version: 2" typecheck error).
          # Omitting version resolves the latest release, which supports the
          # current toolchain. Mirrors the fix applied during local testing.
          args: --timeout=5m

  # ── Job 2: unit-tests ──────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (race + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: |
          GO_PKGS=$(go list ./... | grep -v 'docker/sandbox')
          go test $GO_PKGS \
            -race \
            -timeout 60s \
            -count=1 \
            -coverprofile coverage.out \
            -covermode=atomic

      - name: Show coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  # ── Job 3: tf-validate ─────────────────────────────────────────────────────
  tf-validate:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        working-directory: terraform
        run: terraform init -backend=false -input=false -reconfigure

      - name: terraform validate
        working-directory: terraform
        run: terraform validate

  # ── Job 4: k8s-validate ────────────────────────────────────────────────────
  k8s-validate:
    name: K8s manifest validation (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION="v0.6.7"
          curl -sSfL \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin
          kubeconform -v

      - name: Validate K8s manifests (Stage 4.2 dry-run)
        run: bash scripts/smoke_test_phase4_stage2.sh --dry-run

      - name: Validate ScaledObject + Go gate tests (Stage 4.3 dry-run)
        run: bash scripts/smoke_test_phase4_stage3.sh --dry-run
