# .github/workflows/deploy.yml
#
# Deploy — triggered only on push to main, and only after CI passes.
#
# ── What this does ────────────────────────────────────────────────────────────
#
#   build-and-push
#     Builds six Docker images (control-plane + five sandbox languages) and
#     pushes them to Google Artifact Registry, tagged with both the short
#     commit SHA and `latest`. Sandbox images are built in parallel via a
#     matrix strategy — total build time ~4 min vs ~15 min sequential.
#
#   deploy
#     Authenticates to the dev GKE cluster via Workload Identity Federation
#     (no long-lived service account key stored in GitHub). Performs a rolling
#     update of the control-plane and worker Deployments, then waits for
#     rollout completion. Finally runs the Stage 4.3 live smoke test against
#     the cluster to confirm the deployment is healthy.
#
# ── Workload Identity Federation (no static keys) ─────────────────────────────
#
#   This workflow never stores a GCP service account JSON key in GitHub.
#   Instead it uses WIF: GitHub's OIDC provider issues a short-lived token,
#   which GCP exchanges for a temporary access token scoped to exactly the
#   permissions the service account has.
#
#   One-time setup (done by a human with Owner access, not in CI):
#     gcloud iam workload-identity-pools create "github-pool" \
#         --project="$PROJECT_ID" --location="global"
#     gcloud iam workload-identity-pools providers create-oidc "github-provider" \
#         --project="$PROJECT_ID" --location="global" \
#         --workload-identity-pool="github-pool" \
#         --issuer-uri="https://token.actions.githubusercontent.com" \
#         --attribute-mapping="google.subject=assertion.sub,attribute.repository=assertion.repository"
#     gcloud iam service-accounts add-iam-policy-binding \
#         "nexusbench-cicd@$PROJECT_ID.iam.gserviceaccount.com" \
#         --role="roles/iam.workloadIdentityUser" \
#         --member="principalSet://iam.googleapis.com/projects/$PROJECT_NUM/locations/global/workloadIdentityPools/github-pool/attribute.repository/nexusbench/nexusbench"
#
#   Required GitHub secrets (set under Settings → Environments → production):
#     GCP_PROJECT_ID           — GCP project ID (not a credential)
#     GCP_WORKLOAD_IDENTITY_PROVIDER  — full WIF provider resource name
#     GCP_SERVICE_ACCOUNT      — service account email for impersonation
#     GKE_CLUSTER_NAME         — cluster name (e.g. nexusbench-dev)
#     GKE_CLUSTER_REGION       — cluster region (e.g. us-central1)
#     REGISTRY                 — Artifact Registry host (e.g. us-docker.pkg.dev/project/nexusbench)
#
# ── Rollback ──────────────────────────────────────────────────────────────────
#
#   If `kubectl rollout status` times out or the smoke test fails, the deploy
#   job exits non-zero and GitHub marks the workflow as failed. The previous
#   Deployment revision remains active (kubectl never automatically rolls back).
#   Manual rollback:
#     kubectl rollout undo deployment/control-plane -n nexusbench
#     kubectl rollout undo deployment/worker -n nexusbench

name: Deploy

on:
  push:
    branches: [main]

# Only one deploy runs at a time. If a second push lands while a deploy is
# in progress, the new run waits rather than cancels — we never want to
# interrupt a rollout mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GO_VERSION: "1.25.x"

jobs:
  # ── Job 1: build-and-push ──────────────────────────────────────────────────
  #
  # Builds all Docker images and pushes them to the registry.
  # Runs immediately when a push lands on main — no dependency on CI because
  # the `on: push` trigger only fires after the branch protection rules
  # (which require CI to pass) have been satisfied.
  build-and-push:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Required for Workload Identity Federation token exchange.
    permissions:
      contents: read
      id-token: write

    # Build the five sandbox images in parallel.
    strategy:
      matrix:
        include:
          - image: sandbox-go
            dockerfile: docker/sandbox/Dockerfile.golang
            context: docker/sandbox
          - image: sandbox-rust
            dockerfile: docker/sandbox/Dockerfile.rust
            context: docker/sandbox
          - image: sandbox-cpp
            dockerfile: docker/sandbox/Dockerfile.cpp
            context: docker/sandbox
          - image: sandbox-python
            dockerfile: docker/sandbox/Dockerfile.python
            context: docker/sandbox
          - image: sandbox-binary
            dockerfile: docker/sandbox/Dockerfile.binary
            context: docker/sandbox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.REGISTRY }} --quiet

      - name: Set image tag (short SHA)
        id: tag
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Tag with both the short SHA (immutable, for rollback) and latest
          # (mutable, for convenience). The deploy job always uses the SHA tag
          # to ensure it deploys exactly the image built in this run.
          tags: |
            ${{ secrets.REGISTRY }}/${{ matrix.image }}:${{ steps.tag.outputs.sha }}
            ${{ secrets.REGISTRY }}/${{ matrix.image }}:latest
          # BuildKit inline cache: the pushed image carries cache metadata so
          # the next build can pull layers from the registry instead of
          # rebuilding from scratch. Saves ~2 min on incremental builds.
          cache-from: type=registry,ref=${{ secrets.REGISTRY }}/${{ matrix.image }}:latest
          cache-to: type=inline

  # Build the control-plane image separately (different Dockerfile + context).
  # Defined as a separate job rather than a matrix entry because it uses the
  # repo root as context (needs go.mod, cmd/, internal/) while sandbox images
  # use docker/sandbox/ as their context.
  build-control-plane:
    name: Build & Push control-plane
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    outputs:
      # Expose the SHA tag so the deploy job can reference the exact image.
      sha: ${{ steps.tag.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.REGISTRY }} --quiet

      - name: Set image tag (short SHA)
        id: tag
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push control-plane
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: |
            ${{ secrets.REGISTRY }}/control-plane:${{ steps.tag.outputs.sha }}
            ${{ secrets.REGISTRY }}/control-plane:latest
          cache-from: type=registry,ref=${{ secrets.REGISTRY }}/control-plane:latest
          cache-to: type=inline

  # ── Job 2: deploy ─────────────────────────────────────────────────────────
  #
  # Rolls out the new images to the dev GKE cluster. Only runs after all
  # build jobs succeed. Uses `kubectl set image` + `rollout status` for a
  # controlled rolling update that respects the PodDisruptionBudget.
  deploy:
    name: Deploy to dev cluster
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-and-push, build-control-plane]

    permissions:
      contents: read
      id-token: write

    # Scoped to the `production` GitHub Environment so deployment secrets
    # (cluster credentials) are separate from the default environment and
    # require explicit approval rules if desired.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go (needed for smoke test)
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
          location: ${{ secrets.GKE_CLUSTER_REGION }}

      - name: Set image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      # ── Rolling update: control-plane ──────────────────────────────────────
      # kubectl set image triggers a rolling update that respects
      # maxUnavailable/maxSurge from the Deployment spec. The old pod is only
      # terminated after the new one passes its readinessProbe.
      - name: Update control-plane image
        run: |
          kubectl set image deployment/control-plane \
            control-plane=${{ secrets.REGISTRY }}/control-plane:${{ steps.tag.outputs.sha }} \
            -n nexusbench

      - name: Wait for control-plane rollout
        run: |
          kubectl rollout status deployment/control-plane \
            -n nexusbench \
            --timeout=120s

      # ── Rolling update: worker ─────────────────────────────────────────────
      # The worker Deployment is managed by KEDA's HPA. kubectl set image
      # updates the pod template, which triggers a rolling update respecting
      # the PodDisruptionBudget (maxUnavailable: 1).
      - name: Update worker image
        run: |
          kubectl set image deployment/worker \
            worker=${{ secrets.REGISTRY }}/control-plane:${{ steps.tag.outputs.sha }} \
            -n nexusbench

      - name: Wait for worker rollout
        run: |
          kubectl rollout status deployment/worker \
            -n nexusbench \
            --timeout=120s

      # ── Post-deploy smoke test ─────────────────────────────────────────────
      # Runs the Stage 4.3 live smoke test against the cluster to confirm
      # the deployment is healthy end-to-end: KEDA scales up on queue depth
      # and scales back down after the queue drains.
      - name: Post-deploy smoke test (Stage 4.3 live)
        env:
          # Point the smoke test at the cluster-internal control-plane URL.
          # The port-forward is not needed here because the deploy job runs
          # against the cluster via the GKE credentials above.
          NEXUSBENCH_URL: http://control-plane.nexusbench.svc.cluster.local:8080
        run: bash scripts/smoke_test_phase4_stage3.sh --live

      - name: Print deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Component | Image Tag |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| control-plane | \`${{ steps.tag.outputs.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| worker | \`${{ steps.tag.outputs.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          kubectl get pods -n nexusbench >> "$GITHUB_STEP_SUMMARY" || true
